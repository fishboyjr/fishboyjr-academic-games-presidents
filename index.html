    <defs>

        <ellipse cx="100" cy="152" rx="32" ry="28" fill="#c58a5c"/>
        <path d="M86 146 q6 5 12 0 M102 158 q6 5 12 0 M86 166 q6 5 12 0" stroke="#8a5530" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <g id="p-head">

        <ellipse cx="68" cy="96" rx="10" ry="6" fill="#ff8fa0" opacity=".55"/>
        <ellipse cx="132" cy="96" rx="10" ry="6" fill="#ff8fa0" opacity=".55"/>
      </g>
      <g id="p-eyes-happy">
        <ellipse cx="82" cy="74" rx="9" ry="11.5" fill="#1d2a55"/><ellipse cx="118" cy="74" rx="9" ry="11.5" fill="#1d2a55"/>
        <circle cx="85" cy="69" r="3.5" fill="#fff"/><circle cx="121" cy="69" r="3.5" fill="#fff"/>
        <path d="M72 58 q9-6 18 0 M110 58 q9-6 18 0" stroke="#1d2a55" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </g>
      <g id="p-eyes-cheer"><path d="M72 76 q10-14 20 0 M108 76 q10-14 20 0" stroke="#1d2a55" stroke-width="5" fill="none" stroke-linecap="round"/></g>
      <g id="p-eyes-oops">
        <ellipse cx="82" cy="76" rx="8" ry="10" fill="#1d2a55"/><ellipse cx="118" cy="76" rx="8" ry="10" fill="#1d2a55"/>
        <circle cx="84" cy="72" r="3" fill="#fff"/><circle cx="120" cy="72" r="3" fill="#fff"/>
        <path d="M72 62 q9 -2 18 4 M110 66 q9 -6 18 -4" stroke="#1d2a55" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M140 52 q6 10 0 14 q-6-4 0-14z" fill="#7cc7ff" stroke="#1d2a55" stroke-width="2"/>

      <g id="p-beak">

        <path d="M90 95 q10 4 20 0" stroke="#1d2a55" stroke-width="2.5" fill="none"/>
      </g>
      <g id="p-beak-open">
        <path d="M86 88 Q100 80 114 88 Q112 98 100 100 Q90 98 86 88Z" fill="#ffc233" stroke="#1d2a55" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M90 101 Q100 118 110 101 Z" fill="#e63946" stroke="#1d2a55" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g id="p-wing-l"><path d="M50 118 q-26 12 -18 44 q14-6 26-20z" fill="#6e4224" stroke="#1d2a55" stroke-width="4" stroke-linejoin="round"/></g>

      </g>
      <g id="p-hat">

        <ellipse cx="100" cy="36" rx="44" ry="8" fill="#1f3a93" stroke="#1d2a55" stroke-width="4"/>
      </g>
      <g id="p-bowtie">
        <path d="M100 126 l-20-10 v22 z M100 126 l20-10 v22 z" fill="#e63946" stroke="#1d2a55" stroke-width="3.5" stroke-linejoin="round"/>
        <circle cx="100" cy="126" r="5" fill="#1f3a93" stroke="#1d2a55" stroke-width="3"/>
      </g>
      <symbol id="pat-happy" viewBox="0 -12 200 212"><use href="#p-wing-l"/><use href="#p-wing-wave"/><use href="#p-body"/><use href="#p-head"/><use href="#p-eyes-happy"/><use href="#p-beak"/><use href="#p-bowtie"/><use href="#p-hat"/></symbol>
      <symbol id="pat-cheer" viewBox="0 -12 200 212"><use href="#p-wings-up"/><use href="#p-body"/><use href="#p-head"/><use href="#p-eyes-cheer"/><use href="#p-beak-open"/><use href="#p-bowtie"/><g transform="rotate(-12 100 30) translate(0 -8)"><use href="#p-hat"/></g></symbol>
      <symbol id="pat-oops" viewBox="0 -12 200 212"><use href="#p-wing-l"/><use href="#p-wing-r"/><use href="#p-body"/><use href="#p-head"/><use href="#p-eyes-oops"/><use href="#p-beak"/><use href="#p-bowtie"/><g transform="rotate(8 100 30)"><use href="#p-hat"/></g></symbol>
